<meta charset="utf-8">
<title>Realtika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout в духе каталогов новостроек: белая шапка с разделами сверху (на телефоне вкладки снизу), светло-серый фон,
   контент на белых скруглённых плашках, крупные карточки объектов с фото. Сделка выезжает справа. */
/* Цветовые схемы. Базовая — «Тренд»: нейтральный серый фон в точку, белые плашки, индиго для главного действия,
   оранжевый как второй акцент. Остальные включаются атрибутом data-palette на <html> из настроек кабинета. */
:root {
  --bg: #F4F4F5; --surface: #FFFFFF; --sunken: #F3F4F6; --hover: #E4E4E7; --ink: #18181B; --muted: #71717A; --line: #E4E4E7; --dot: #D4D4D8;
  --accent: #3733FF; --accent-ink: #FFFFFF; --accent-d: #8F8CFF; --accent-ink-d: #07063A; --hot: #FE4B01;
  --side-bg: #FFFFFF; --side-ink: #18181B; --side-muted: #71717A; --side-hover: #F3F4F6; --side-line: #E4E4E7; --side-field: #F3F4F6;
  --panel: #3733FF;
  --ok: #12805C; --warn: #A15C07; --crit: #D92D20;
  --f-display: Onest, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: Onest, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* шкала размеров: всё текстовое берёт только эти шесть значений */
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
  --ease: cubic-bezier(.165, .84, .44, 1); /* плавное торможение, как у слайдеров на trendagent.ru */
  --r: 24px;
  --col: color-mix(in srgb, var(--ink) 7%, var(--bg)); --card: var(--surface); --card-line: color-mix(in srgb, var(--ink) 10%, transparent);
  --s1: 8px; --s2: 24px; --s3: 56px; /* внутри элемента / между элементами / между секциями */
}
:root[data-palette="graphite"] {
  --bg: #F6F6F5; --surface: #FFFFFF; --sunken: #EEEEEC; --hover: #EBEBE8; --ink: #1A1A19; --muted: #686965; --line: #E2E2DE;
  --accent: #D9480F; --accent-ink: #FFFFFF; --accent-d: #FF8C55; --accent-ink-d: #1C0C03;
  --side-bg: #1C1D1F; --side-ink: #F2F2F0; --side-muted: #9C9D99; --side-hover: rgb(255 255 255 / .07); --side-line: #2A2B2E; --side-field: rgb(255 255 255 / .06);
  --panel: #1C1D1F;
}
:root[data-palette="burgundy"] {
  --bg: #F7F5F3; --surface: #FFFDFC; --sunken: #EFEBE7; --hover: #ECE6E1; --ink: #231B1A; --muted: #72645E; --line: #E5DED8;
  --accent: #8A1C3B; --accent-ink: #FFFFFF; --accent-d: #E77D9B; --accent-ink-d: #2A0711;
  --side-bg: #F0EBE6; --side-ink: #231B1A; --side-muted: #72645E; --side-hover: #E5DDD6; --side-line: #E2D9D1; --side-field: #FFFDFC;
  --panel: #3A1220;
}
:root[data-palette="emerald"] {
  --bg: #F5F7F6; --surface: #FFFFFF; --sunken: #ECF1EE; --hover: #E6ECE8; --ink: #142019; --muted: #5C6D63; --line: #DCE4DF;
  --accent: #14724F; --accent-ink: #FFFFFF; --accent-d: #4FCB98; --accent-ink-d: #04140D;
  --side-bg: #10301F; --side-ink: #EAF3EE; --side-muted: #94B4A3; --side-hover: rgb(255 255 255 / .08); --side-line: #1B4430; --side-field: rgb(255 255 255 / .07);
  --panel: #10301F;
}
:root[data-palette="mono"] {
  --bg: #FAFAFA; --surface: #FFFFFF; --sunken: #F2F2F2; --hover: #EEEEEE; --ink: #111111; --muted: #6B6B6B; --line: #E4E4E4;
  --accent: #111111; --accent-ink: #FFFFFF; --accent-d: #F2F2F2; --accent-ink-d: #111111;
  --side-bg: #FAFAFA; --side-ink: #111111; --side-muted: #6B6B6B; --side-hover: #EEEEEE; --side-line: #E4E4E4; --side-field: #FFFFFF;
  --panel: #111111;
}
:root[data-palette="classic"] {
  --bg: #F7F7F8; --surface: #FFFFFF; --sunken: #F0F1F3; --hover: #EDEEF1; --ink: #18191C; --muted: #686C74; --line: #E3E4E8;
  --accent: #3A5BD9; --accent-ink: #FFFFFF; --accent-d: #7D92FF; --accent-ink-d: #0D1022;
  --side-bg: #FBFBFC; --side-ink: #18191C; --side-muted: #686C74; --side-hover: #EDEEF1; --side-line: #E3E4E8; --side-field: #FFFFFF;
  --panel: #17181B;
}
/* Тёмная тема: общие тёмные нейтрали, акцент — светлый вариант цвета выбранной схемы */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111213; --surface: #1F2023; --sunken: #2A2B2F; --hover: #2A2B2F; --ink: #ECECEA; --muted: #A3A49F; --line: #303135;
    --accent: var(--accent-d); --accent-ink: var(--accent-ink-d);
    --side-bg: #141516; --side-ink: #E9E9E7; --side-muted: #9C9D99; --side-hover: #232427; --side-line: #2A2B2E; --side-field: #1B1C1E;
    --ok: #4CC38A; --warn: #E3A04A; --crit: #F07468; --dot: #26272A; color-scheme: dark;
    --col: #17181A; --card: #2A2B2F; --card-line: rgb(255 255 255 / .08);
  }
}
:root[data-theme="dark"] {
  --bg: #111213; --surface: #1F2023; --sunken: #2A2B2F; --hover: #2A2B2F; --ink: #ECECEA; --muted: #A3A49F; --line: #303135;
  --accent: var(--accent-d); --accent-ink: var(--accent-ink-d);
  --side-bg: #141516; --side-ink: #E9E9E7; --side-muted: #9C9D99; --side-hover: #232427; --side-line: #2A2B2E; --side-field: #1B1C1E;
  --ok: #4CC38A; --warn: #E3A04A; --crit: #F07468; --dot: #26272A; color-scheme: dark;
    --col: #17181A; --card: #2A2B2F; --card-line: rgb(255 255 255 / .08);
}
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(circle, var(--dot) 1px, transparent 1.5px) 0 0 / 22px 22px fixed, var(--bg); color: var(--ink); font: var(--fs-md)/1.5 var(--f-body); }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; box-sizing: border-box; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--f-display); font-weight: 600; letter-spacing: -.03em; }
h2 { font-size: var(--fs-2xl); line-height: 1.15; }
.dlg h2 { font-size: var(--fs-xl); }
.muted { color: var(--muted); }
.small { font-size: var(--fs-sm); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; box-sizing: border-box; background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--side-line); padding: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px; }
.logo { display: flex; align-items: center; gap: 8px; font: 600 var(--fs-xl)/1 var(--f-display); letter-spacing: -.03em; }
.logo small { font: 500 var(--fs-xs)/1 var(--f-body); color: var(--side-muted); }
.mark { position: relative; overflow: hidden; width: 30px; height: 30px; border-radius: 10px; color: var(--accent-ink); display: grid; place-items: center; flex: none;
  /* Объём: светлый верхний край, тень снизу и цветное свечение вокруг */
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 55%, #fff), var(--accent) 50%, color-mix(in srgb, var(--accent) 70%, #000));
  box-shadow: inset 0 1.5px 1px rgb(255 255 255 / .55), inset 0 -3px 6px rgb(0 0 0 / .28), 0 6px 16px -4px color-mix(in srgb, var(--accent) 75%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.mark svg { width: 66%; height: 66%; fill: currentColor; filter: drop-shadow(0 1.5px 1.5px rgb(0 0 0 / .3)); }
.icon-btn { position: relative; width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--side-muted); cursor: pointer; }
.icon-btn:hover { background: var(--side-hover); color: var(--side-ink); }
.icon-btn svg, .side-search svg, .tab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-btn b { position: absolute; top: 1px; right: 1px; min-width: 16px; height: 16px; padding: 0 3px; box-sizing: border-box; border-radius: 8px; background: var(--crit); color: #fff; font: 600 var(--fs-xs)/16px var(--f-body); text-align: center; }
.side-search { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; color: var(--side-muted); background: var(--side-field); border: 1px solid var(--side-line); border-radius: 6px; padding: 6px 8px; cursor: pointer; text-align: left; }
.side-search:hover { color: var(--side-ink); }
.side kbd { color: var(--side-muted); border-color: var(--side-line); background: none; }
.side-search span { flex: 1; }
kbd { font: 500 var(--fs-xs)/1.4 var(--f-body); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg); }
.side-new { width: 100%; justify-content: center; display: flex; }
nav.tabs { display: grid; gap: 1px; flex: 1; align-content: start; }
.tab { display: flex; align-items: center; gap: 10px; font: 500 var(--fs-md) var(--f-body); color: var(--side-muted); background: none; border: 0; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
.tab:hover { background: var(--side-hover); color: var(--side-ink); }
.tab[aria-current="page"] { background: var(--side-hover); color: var(--side-ink); font-weight: 600; }
.tab b { margin-left: auto; font: 600 var(--fs-xs)/18px var(--f-body); min-width: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--crit); color: #fff; text-align: center; font-variant-numeric: tabular-nums; }
.main-col { min-width: 0; padding-inline: 28px; }
.me { display: flex; align-items: center; gap: 10px; width: 100%; font: 500 var(--fs-md) var(--f-body); color: var(--side-ink); background: none; border: 0; border-radius: 6px; padding: 6px; cursor: pointer; text-align: left; }
.me:hover, .me[aria-current="page"] { background: var(--side-hover); }
.me .avatar { --size: 26px; }
.avatar { --size: 34px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; display: inline-grid; place-items: center; overflow: hidden;
  background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); font: 600 calc(var(--size) * .38) / 1 var(--f-body); letter-spacing: .02em; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.big { --size: 88px; }

.demo-acc { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 4px; }
/* Главная до входа: на весь экран, логотип слева, «Войти» справа, крупное название по центру. Вход — отдельный экран */
.login { background: radial-gradient(circle, var(--dot) 1px, transparent 1.5px) 0 0 / 22px 22px, var(--surface); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; box-sizing: border-box; padding: 0 clamp(16px, 4vw, 56px) 32px; position: relative; overflow: hidden; }
.land-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 24px; position: relative; z-index: 1; }
.land-head .logo { font-size: var(--fs-2xl); gap: 10px; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; }
.land-head .mark { width: 40px; height: 40px; border-radius: 13px; }
.btn.outline { background: none; border: 2px solid var(--line); padding: 11px 28px; font-size: var(--fs-md); }
.btn.outline:hover { border-color: var(--ink); }
.hero { flex: 1; display: grid; align-content: center; justify-items: center; text-align: center; gap: 18px; position: relative; z-index: 1; }
.wordmark { font: 600 clamp(72px, 16vw, 240px)/.9 var(--f-display); letter-spacing: -.055em; margin: 0; }
.slogan { font: 500 clamp(20px, 2.4vw, 32px)/1.2 var(--f-display); letter-spacing: -.02em; color: var(--muted); margin: 0; }
.cta { display: flex; gap: 4px; margin-top: 18px; }
.btn.big { padding: 18px 34px; font-size: var(--fs-lg); }
.btn.circle { position: relative; width: 60px; height: 60px; padding: 0; }
.btn.circle .arr { position: absolute; inset: 0; width: auto; height: auto; margin: 0; background: none; }
.btn.circle .arr svg { inset: 23px; width: 14px; height: 14px; }
.btn.circle .arr svg + svg { transform: translate(-300%, 300%); }
.land-bg { position: absolute; z-index: 0; right: -6vw; bottom: -10vw; width: min(52vw, 680px); fill: var(--sunken); pointer-events: none; }
.login-title { font-size: clamp(44px, 6vw, 72px); text-align: center; margin: 3vh 0 32px; }
.login-box { width: min(560px, 100%); margin: 0 auto; box-sizing: border-box; background: var(--sunken); border-radius: 40px; padding: clamp(24px, 4vw, 48px); display: grid; gap: 14px; position: relative; z-index: 1; }
.login-box input { background: var(--surface); padding: 16px 20px; border-radius: 16px; font-size: var(--fs-md); }
.login-box .btn.primary { padding: 18px; font-size: var(--fs-md); margin-top: 6px; }
.login-box .forgot { justify-self: center; color: var(--ink); text-decoration: none; font-size: var(--fs-md); }
.login-box .acc { background: var(--surface); }
.login-box .acc:hover { background: var(--hover); }
.login-box .demo-acc { border-color: color-mix(in srgb, var(--ink) 8%, transparent); }
.acc { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--sunken); border: 0; border-radius: 999px; padding: 6px 16px 6px 6px; cursor: pointer; }
.acc:hover { background: var(--hover); }
.acc .avatar { --size: 30px; }
.acc small { display: block; color: var(--muted); font-size: var(--fs-sm); }

.profile-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 20px; }
.profile-head h2 { font-size: var(--fs-xl); }
.palettes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pal { display: grid; gap: 8px; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; }
.pal[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.pal i { display: flex; height: 28px; border-radius: 5px; overflow: hidden; outline: 1px solid var(--line); outline-offset: -1px; }
.pal i b { flex: 1; }
.profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.panel { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 12px; }
.panel h3 { font-size: var(--fs-md); }

.btn { font: 500 var(--fs-md)/1.3 var(--f-body); padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 28%, var(--line)); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:not(:hover):not(:disabled) { box-shadow: inset 0 0 15px 10px rgb(255 255 255 / .15); }
.btn:active:not(:disabled) { transform: scale(.98); }
/* Круг со стрелкой в главной кнопке: при наведении стрелка улетает вверх-вправо, новая прилетает снизу-слева */
.arr { position: relative; width: 26px; height: 26px; margin: -4px -12px -4px 8px; border-radius: 50%; background: rgb(255 255 255 / .2); overflow: hidden; display: inline-block; vertical-align: middle; flex: none; }
.arr svg { position: absolute; inset: 7px; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.arr svg + svg { transform: translate(-130%, 130%); }
.btn.sm { padding: 6px 12px; font-size: var(--fs-sm); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.call svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.btn.link { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 500; text-decoration: underline; text-align: left; }
td .btn.link, .trow .btn.link, .alert .btn.link, .fi .btn.link { color: var(--ink); text-decoration: none; font-weight: 500; }
td .btn.link:hover, .trow .btn.link:hover, .alert .btn.link:hover, .fi .btn.link:hover { color: var(--accent); }

main { max-width: 1400px; padding-block: 32px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s3); }
.section { display: grid; gap: var(--s1); min-width: 0; }
.section > .block + .block, .section > .section-head + .block { margin-top: calc(var(--s2) - var(--s1)); }
.section > .section-head + .block:first-of-type { margin-top: 0; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select { width: auto; }
.group-title { font-size: var(--fs-sm); font-weight: 600; color: var(--muted); margin: 0; }

/* Статусы — цветным текстом; заливку оставляем только просрочке и отказу, чтобы они выделялись */
.pill { display: inline-flex; align-items: center; border-radius: 999px; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.alert .pill, .card .pill { white-space: normal; }
.row .pill + .pill::before { content: "·"; margin-right: 6px; color: var(--muted); }
.pill.crit { padding: 2px 9px; background: color-mix(in srgb, currentColor 13%, transparent); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.crit { color: var(--crit); } .pill.muted { color: var(--muted); } .pill.accent { color: var(--accent); }

.stats { display: flex; flex-wrap: wrap; gap: var(--s2) 48px; }
.stat { display: grid; gap: 2px; }
.stat b { font: 600 var(--fs-2xl)/1.15 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.list { border-top: 1px solid var(--line); }
.list > * { border-bottom: 1px solid var(--line); }
.list > *:last-child { border-bottom: 0; }
.alert { display: grid; grid-template-columns: 190px 1fr auto; gap: 6px 14px; align-items: center; padding: 9px 6px; }
.alert p { margin: 0; min-width: 0; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 6px; }
.trow:hover, .alert:hover { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.trow input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.trow > label, .trow .title { color: var(--ink); font-size: var(--fs-md); font-weight: 500; }
.trow .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: var(--fs-sm); color: var(--muted); }
.empty { padding: 16px 6px; color: var(--muted); }

.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--col); border-radius: 20px; padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col h3 { font-size: var(--fs-md); font-weight: 600; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; padding: 2px 4px; }
.card { display: grid; gap: 3px; width: 100%; box-sizing: border-box; text-align: left; font: inherit; color: inherit; text-decoration: none; background: var(--card); border: 1px solid var(--card-line); border-radius: 16px; padding: 12px 14px; cursor: grab; box-shadow: 0 1px 2px rgb(16 24 40 / .06); }
.card:hover { box-shadow: 0 6px 18px rgb(16 24 40 / .1); }
/* Давность контакта — текстом, без плашек; «давно не писали» — точкой цвета предупреждения */
.since { font-size: var(--fs-sm); color: var(--muted); }
.since.warn { color: var(--warn); }
.since.crit { color: var(--crit); }
.card .amt { margin-left: 0; justify-self: end; }
@media (min-width: 641px) {

    if (d.budget) why.push(o.price <= d.budget ? ['ok', 'в бюджете'] : ['warn', `на ${Math.round((o.price / d.budget - 1) * 100)}% выше бюджета`]);

  });

function applyTheme() {

function showLogin(email) {
  $('drawer').close(); $('modal').close();
  delete document.documentElement.dataset.theme;

function logIn(id, restore = false) {
  S.me = id; session = id;
  try { localStorage.setItem(SK, id); } catch (e) {}
  ui = { dealId: null, placeId: null, unitId: null, rooms: null, draft: false, editing: false, preview: null, stageErr: '' }; filterAgent = '';
  if (!restore) tab = 'tasks';
  shownTab = '';
  save(); applyTheme();
  $('login').hidden = true; $('app').hidden = false;
  render(); window.scrollTo(0, 0);
  route();
}
function logOut() {
  session = null;
  try { localStorage.removeItem(SK); } catch (e) {}
  showLogin(me().email);
}

// Плавное появление блоков раздела: видимые сразу — по очереди, остальные — когда доскроллили
let shownTab = '';
const io = 'IntersectionObserver' in window && new IntersectionObserver(es => es.filter(e => e.isIntersecting).forEach((e, n) => {
  e.target.style.setProperty('--i', Math.min(n, 8)); e.target.classList.add('in'); io.unobserve(e.target);
}), { rootMargin: '0px 0px -40px' });
function reveal(root) {
  if (!io || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('.hero > *, .login-title, .login-box, .hello, .section-head, .filters, .dash-main > .section, .dash > aside, .col, .rcard, .tbl, .stats, #map').forEach(el => {
    el.classList.add('rise'); io.observe(el);
  });

function countUp(el) {
  const m = el.textContent.match(/\d(?:[\d\s]*\d)?/);
  if (!m) return;
  const to = Number(m[0].replace(/\s/g, '')), [pre, post] = [el.textContent.slice(0, m.index), el.textContent.slice(m.index + m[0].length)];
  const fmt = n => pre + new Intl.NumberFormat('ru-RU').format(n) + post, t0 = performance.now();
  const tick = now => { const k = Math.min((now - t0) / 1200, 1); el.textContent = fmt(Math.round(to * (1 - (1 - k) ** 3))); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

function applyAdvance() {

  const task = (title, due, closeOn) => S.tasks.push({ id: 't' + (++S.seq), dealId: d.id, title, due, done: false, closeOn });

function dealFields(d) {

function readForm() {

function openDeal(id, draft = false) {
  if (!scopedIds().has(id)) return;
  if (ui.dealId !== id || ui.placeId) { ui = { ...ui, dealId: id, placeId: null, editing: false, preview: null }; if ($('note')) $('note').value = ''; }
  $('drawer').classList.remove('wide'); $('drawer').classList.add('page');
  ui.draft = draft;
  renderDeal();
  if (!$('drawer').open) { $('drawer').showModal(); $('drawer').scrollTop = 0; }

}

// Разбор заметки агента: показываем изменения, применяем только после подтверждения
function previewNote(text) {
  const d = deal(ui.dealId), r = parseChat(text);
  const changes = [], fields = {};
  FIELDS.forEach(([k, label, f]) => {
    if (r[k] !== undefined && r[k] !== d[k]) { changes.push([label, f(d[k]), f(r[k])]); fields[k] = r[k]; }
  });
  const task = r.next ? { title: taskTitle(r.next.kind), due: iso(r.next.inDays) } : null;
  // этап меняется только через переход с обязательными данными, поэтому из заметки его не применяем
  return { text, changes, fields, stage: null, task };
}

const activeFilters = () => [F.market, F.rooms.length, F.priceFrom, F.priceTo, F.areaFrom, F.areaTo, F.district.length, F.notFirst, F.notLast, !F.onlyFree].filter(Boolean).length;
function passes(o) {
  const num = v => v === '' ? null : Number(v);
  if (!visible(o)) return false;
  if (F.onlyFree && o.status !== 'свободна') return false;
  if (F.market && o.type !== F.market) return false;
  if (F.rooms.length && !F.rooms.includes(o.rooms)) return false;
  if (num(F.priceFrom) != null && o.price < num(F.priceFrom) * 1e6) return false;
  if (num(F.priceTo) != null && o.price > num(F.priceTo) * 1e6) return false;
  if (num(F.areaFrom) != null && o.area < num(F.areaFrom)) return false;
  if (num(F.areaTo) != null && o.area > num(F.areaTo)) return false;
  if (F.district.length && !F.district.includes(o.district)) return false;
  if (F.notFirst && o.floor <= 1) return false;
  if (F.notLast && o.floor >= o.floors) return false;
  const q = F.q.trim().toLowerCase();
  return !q || `${o.address} ${o.district}`.toLowerCase().includes(q);
}
const sortKey = o => ({ price: o.price, priceDesc: -o.price, area: -o.area, m2: o.price / o.area }[F.sort]);
function search() {
  const found = S.objects.filter(passes);
  const items = [
    ...S.complexes.map(c => ({ c, units: found.filter(o => o.complexId === c.id).sort((a, b) => sortKey(a) - sortKey(b)) })).filter(g => g.units.length).map(g => ({ ...g, key: sortKey(g.units[0]) })),
    ...found.filter(o => !o.complexId).map(o => ({ o, key: sortKey(o) })),
  ].sort((a, b) => a.key - b.key);
  return { items, count: found.length };
}
function fromDeal(d) {
  return { ...F0, rooms: d.rooms == null ? [] : [d.rooms], market: d.type === 'любая' ? '' : d.type, district: d.district ? [d.district] : [], priceTo: d.budget ? Math.round(d.budget * 1.05 / 1e5) / 10 : '' };
}
function readFilters() {
  F = { ...F, q: $('f-q').value, market: $('f-market').value, priceFrom: $('f-pf').value, priceTo: $('f-pt').value, areaFrom: $('f-af').value, areaTo: $('f-at').value,
    notFirst: $('f-nf').checked, notLast: $('f-nl').checked, onlyFree: $('f-free').checked, sort: $('f-sort').value };
}

// Иллюстрация фасада вместо фото дома. shortcut: рисунок, не фото; заменить фотографиями от застройщика и агента
function facadeSvg(key, floors, old) {
  const h = [...key].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const walls = old ? ['#B86B4B', '#C9A27E', '#9A938A', '#D3C2A4'] : ['#E7E1D6', '#C8D4DC', '#D8CAB6', '#C2CCC1', '#E2D2C4'];
  const wall = walls[h % walls.length], fl = Math.min(floors, old ? 7 : 16);
  const W = 480, H = 300, bw = old ? 320 : 230 + (h % 3) * 30, bx = (W - bw) / 2, fh = Math.min(old ? 30 : 18, 230 / fl), top = H - 26 - fl * fh;
  const cols = Math.floor(bw / (old ? 40 : 28)), cw = (bw - 20) / cols;
  let win = '';
  for (let f = 0; f < fl; f++) for (let c = 0; c < cols; c++) {
    const lit = (h >> ((f * cols + c) % 24)) & 1 && (f + c + h) % 5 === 0;
    win += `<rect x="${(bx + 10 + c * cw + cw * 0.22).toFixed(1)}" y="${(top + f * fh + fh * 0.22).toFixed(1)}" width="${(cw * 0.56).toFixed(1)}" height="${(fh * 0.56).toFixed(1)}" rx="1.5" fill="${lit ? '#F3DFA2' : '#8FA8BA'}"/>`;
  }
  const tree = x => `<rect x="${x - 3}" y="${H - 52}" width="6" height="28" fill="#6B5642"/><circle cx="${x}" cy="${H - 62}" r="22" fill="#7E9B6A"/><circle cx="${x + 12}" cy="${H - 52}" r="14" fill="#6E8C5C"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Иллюстрация дома">
    <rect width="${W}" height="${H}" fill="#D8E7F0"/><circle cx="${60 + h % 300}" cy="56" r="26" fill="#F5F0E1" opacity=".7"/>
    <rect x="${bx}" y="${top}" width="${bw}" height="${H - 26 - top}" fill="${wall}"/><rect x="${bx - 6}" y="${top - 8}" width="${bw + 12}" height="8" fill="#5E6560"/>
    ${win}<rect x="${W / 2 - 16}" y="${H - 26 - fh * 0.9}" width="32" height="${fh * 0.9}" fill="#4C5752"/>
    <rect y="${H - 26}" width="${W}" height="26" fill="#A3B48F"/>${tree(40)}${tree(W - 52)}</svg>`;
}
const facadeOf = x => x.complexId || x.layout ? facadeSvg(x.complexId || x.id, x.floors, false) : facadeSvg(x.id, x.floors || 9, true);

function resultCard(it) {

    <div class="rbody"><div class="rtitle"><button class="btn link" data-act="place" data-id="${o.id}">${roomsLabel(o.rooms)}, ${o.area} м² · ${esc(o.address)}</button>${o.draft ? pill('muted', 'черновик') : pill('ok', 'вторичка')}</div>
      <span class="small muted">${o.district} район · ${o.floor} из ${o.floors} эт.${o.renovation ? ' · ' + RENO_TEXT[o.renovation] : ''}</span>
      <span class="price">${mln(o.price)}</span>
      <span class="small muted">${rub(o.price / o.area)} за м²${o.status !== 'свободна' ? ' · ' + o.status : ''}</span>
      ${pubs.length ? `<span class="small muted">Опубликовано: ${pubs.join(', ')}</span>` : ''}

function fillResults() {
  const box = $('results');
  if (!box) return;
  if (map) { map.remove(); map = null; }
  const { items, count } = search();
  $('found').textContent = `Найдено ${count} ${plural(count, ['квартира', 'квартиры', 'квартир'])} в ${items.length} ${plural(items.length, ['объекте', 'объектах', 'объектах'])}`;
  if (objView === 'map') { box.innerHTML = '<div id="map" role="region" aria-label="Карта объектов"></div>'; initMap(items); return; }
  box.innerHTML = items.length ? `<div class="results">${items.map(resultCard).join('')}</div>`
    : '<div class="list"><div class="empty">Ничего не нашлось. Расширьте цену или площадь, уберите район или сбросьте фильтры.</div></div>';
}

function tiles(m) {
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' })
    .on('load', () => m.getContainer().classList.add('ready')).on('tileerror', () => m.getContainer().classList.add('ready')).addTo(m);
}
function initMap(items) {
  const el = $('map');
  if (!window.L) { el.classList.add('map-empty'); el.textContent = 'Карта не загрузилась. Проверьте интернет и обновите страницу; режим «Список» работает.'; return; }
  map = L.map(el, { zoomSnap: 0.25, wheelPxPerZoomLevel: 90 });
  const pts = items.map(it => it.c ? [it.c.lat, it.c.lng] : [it.o.lat, it.o.lng]);
  if (mapView) map.setView(mapView.c, mapView.z);
  else if (pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 15 });
  else map.setView([59.93, 30.33], 11);
  tiles(map);
  const pin = (lat, lng, label, cls, id) => L.marker([lat, lng], { icon: L.divIcon({ className: 'pin ' + cls, html: `<span>${esc(label)}</span>`, iconSize: [0, 0] }), title: label })
    .on('click', () => openPlace(id)).addTo(map);
  items.forEach(it => it.c
    ? pin(it.c.lat, it.c.lng, `${it.c.name.replace('ЖК ', '')} · ${it.units.length} кв. от ${mlnShort(it.units[0].price)}`, 'new', it.c.id)
    : pin(it.o.lat, it.o.lng, `${roomsLabel(it.o.rooms)} · ${it.o.status === 'свободна' ? mlnShort(it.o.price) : it.o.status}`, it.o.status === 'свободна' ? '' : 'off', it.o.id));
  map.on('moveend', () => { mapView = { c: map.getCenter(), z: map.getZoom() }; });
}

// Схема квартиры по числу комнат и площади. shortcut: схема, не настоящий план; заменить на картинки планировок от застройщика
function planSvg(rooms, area) {
  const W = 360, H = 220, L0 = 96, wet = 9;
  const cells = rooms === 0 ? [['Студия', area - wet]] : [['Кухня', 11], ...Array.from({ length: rooms }, (_, i) => [rooms === 1 ? 'Комната' : `Комната ${i + 1}`, Math.round((area - 11 - wet) / rooms)])];
  const cw = (W - L0) / cells.length;
  const cell = (x, y, w, h, cls, name, m2) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}"/><text x="${x + w / 2}" y="${y + h / 2 - 2}">${name}</text><text class="sub" x="${x + w / 2}" y="${y + h / 2 + 14}">${m2} м²</text>`;
  return `<svg class="plan" viewBox="-6 -6 ${W + 12} ${H + 12}" role="img" aria-label="Схема квартиры: ${roomsLabel(rooms)}, ${area} м²">
    ${cell(0, 0, L0, H * 0.45, 'wet', 'С/у', 4)}${cell(0, H * 0.45, L0, H * 0.55, 'room', 'Прихожая', 5)}
    ${cells.map(([name, m2], i) => cell(L0 + i * cw, 0, cw, H, 'room', name, m2)).join('')}
    <rect class="outer" x="0" y="0" width="${W}" height="${H}"/></svg>`;
}

function openPlace(id, unitId) {

const bookStage = () => S.stages.find(s => s.gate === 'booking');
function unitDetail(u) {

function genDescription(o) {
  const kind = o.rooms === 0 ? 'квартира-студия' : o.rooms ? `${o.rooms}-комнатная квартира` : 'квартира';
  const parts = [`Продаётся ${kind}${o.area ? ` площадью ${o.area} м²` : ''}${o.floor ? ` на ${o.floor}${o.floors ? ` из ${o.floors}` : ''} этаже` : ''}${o.address ? `, ${o.address}` : ''}${o.district ? `, ${o.district} район` : ''}.`];
  const det = [];
  if (o.kitchen) det.push(`кухня ${o.kitchen} м²`);
  if (o.renovation) det.push(RENO_TEXT[o.renovation]);
  if (o.bathroom) det.push(`санузел ${o.bathroom}`);
  if (o.balcony) det.push('есть балкон');
  if (det.length) parts.push(det.join(', ').replace(/^./, ch => ch.toUpperCase()) + '.');
  if (o.price) parts.push(`Цена ${mln(o.price)}${o.area ? ` (${rub(o.price / o.area)} за м²)` : ''}.`);
  parts.push('Покажем в удобное для вас время.');
  return parts.join(' ');
}

function initPickMap() {

function readPhoto(file, max = 1000) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error(file.name)); };
    img.src = url;
  });
}
function saveListing(mode) {
  syncListing();
  const l = ui.listing, ext = PLATFORMS.some(([k]) => l.platforms[k]);
  const missing = [!l.address && 'адрес', l.rooms == null && 'комнаты', !l.area && 'площадь', !l.floor && 'этаж', !l.price && 'цена'].filter(Boolean);
  if (mode === 'publish' && missing.length) { ui.listingMsg = `!Для публикации заполните: ${missing.join(', ')}.`; return rerenderListing(); }
  if (mode === 'publish' && ext && !l.photos.length) { ui.listingMsg = '!Авито, Циан и другие площадки не принимают объявления без фото. Добавьте хотя бы одно.'; return rerenderListing(); }
  if (!l.lat) {
    const near = S.objects.filter(o => o.district === l.district);
    [l.lat, l.lng] = near.length ? [near[0].lat, near[0].lng] : [59.93, 30.33];
  }
  const o = { ...l, floors: l.floors || l.floor, draft: mode === 'draft', publishedAt: mode === 'publish' ? (l.draft === false && l.publishedAt) || iso(0) : null };
  if (!o.id) Object.assign(o, { id: 'o' + (++S.seq), type: 'вторичка', status: 'свободна', agentId: S.me });
  if (!o.description) o.description = genDescription(o);
  const i = S.objects.findIndex(x => x.id === o.id), prev = S.objects[i];
  if (i >= 0) S.objects[i] = o; else S.objects.push(o);
  if (!save()) {
    if (i >= 0) S.objects[i] = prev; else S.objects.pop();
    ui.listingMsg = '!Не хватает места в браузере для фото. Удалите часть фото и попробуйте снова.';
    return rerenderListing();
  }
  $('modal').close(); tab = 'objects'; render(); openPlace(o.id);
}

    ${ui.stageErr ? `<p class="err">${esc(ui.stageErr)}</p>` : ''}
    <div class="actions"><button class="btn sm" data-act="st-add">+ Добавить этап</button><button class="btn primary sm" data-act="close">Готово</button></div></div>`;
  if (!$('modal').open) $('modal').showModal();
}

function openInvoice(id) {
  const k = S.commissions.find(x => x.id === id), d = deal(k.dealId), o = ob(k.objectId);
  $('modal').innerHTML = `<div class="dlg">
    <div class="dlg-head"><div><h2>Счёт № R-${k.dealDate.slice(0, 4)}-${k.id.toUpperCase()}</h2><span class="muted small">от ${fmtDate(iso(0))}</span></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <div class="invoice"><dl>
      <dt>Исполнитель</dt><dd>АН «Демо-Недвижимость», ИНН 0000000000<br><span class="small muted">реквизиты берутся из настроек агентства</span></dd>
      <dt>Плательщик</dt><dd>${k.payer === 'Застройщик' ? `Застройщик, ${esc(o.address)}` : `Продавец объекта: ${esc(o.address)}`}</dd>
      <dt>Услуга</dt><dd>Агентское вознаграждение по сделке: ${esc(objTitle(o))}, покупатель ${esc(d.name)}, сделка ${fmtDate(k.dealDate)}</dd>
    </dl><div class="total"><span>Итого к оплате</span><span>${rub(k.amount)}</span></div></div>
    <p class="small muted" style="margin:0">Оплата поступает напрямую на счёт агентства. Realtika платежи не принимает.</p>
    <div class="actions">${k.status === 'ожидается' ? `<button class="btn primary" data-act="issue" data-id="${k.id}">Отметить: счёт выставлен</button>` : pill(commState(k.status), k.status)}</div></div>`;
  if (!$('modal').open) $('modal').showModal();
}

function moveStage(id, delta) {
  const i = S.stages.findIndex(s => s.id === id), j = i + delta;
  if (j < 0 || j >= S.stages.length) return;
  [S.stages[i], S.stages[j]] = [S.stages[j], S.stages[i]];
}
const stagesChanged = () => { ui.stageErr = ''; save(); render(); openStages(); };

document.addEventListener('click', e => {
  const dlg = e.target.closest('dialog');
  if (e.target === dlg) { dlg.close(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (!e.target.closest('#modal')) ui.flash = '';
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'tab': tab = el.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (err) {} $('modal').close(); $('drawer').close(); window.scrollTo(0, 0); break;
    case 'deal': if (e.ctrlKey || e.metaKey || e.shiftKey) return; e.preventDefault(); if ($('modal').classList.contains('search')) $('modal').close(); openDeal(id); return;
    case 'search': openSearch(); return;
    case 'logout': logOut(); return;
    case 'palette': me().settings.palette = id; applyTheme(); break;
    case 'demo-login': logIn(id); return;
    case 'to-login': loginView = 'form'; renderLogin(); window.scrollTo(0, 0); $('lg-email').focus(); return;
    case 'land': loginView = 'land'; renderLogin(); return;
    case 'forgot': { const er = $('lg-err'); er.textContent = 'Это демо: пароль для всех аккаунтов — demo.'; er.hidden = false; return; }
    case 'advance': openAdvance(id); return;
    case 'lose': openLose(id); return;
    case 'back': {
      const d = deal(id), i = S.stages.findIndex(s => s.id === d.stageId);
      d.stageId = S.stages[i - 1].id;
      d.notes.push({ date: iso(0), author: S.me, kind: 'stage', text: `Возвращена на этап «${S.stages[i - 1].name}»` });
      break;
    }
    case 'theme': {
      const dark = matchMedia('(prefers-color-scheme: dark)').matches, cur = me().settings.theme;
      me().settings.theme = (cur === 'dark' || (cur !== 'light' && dark)) ? 'light' : 'dark';
      if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { applyTheme(); break; }
      const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, st = document.documentElement.style;
      st.setProperty('--tx', x + 'px'); st.setProperty('--ty', y + 'px');
      st.setProperty('--tr', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
      document.startViewTransition(applyTheme);
      break;
    }
    case 'reopen': { const d = deal(id); d.notes.push({ date: iso(0), author: S.me, kind: 'stage', text: `Возвращена в работу после отказа: ${d.lost.reason}` }); d.lost = null; break; }
    case 'draft': openDeal(id, true); return;
    case 'close': el.closest('dialog').close(); return;
    case 'contact': { const d = deal(id), was = d.lastContact, n = { date: iso(0), author: S.me, kind: 'contact', text: 'Связался с клиентом' };
      d.lastContact = iso(0); d.notes.push(n); toast('Контакт отмечен в ленте сделки', ['Вернуть', () => { d.lastContact = was; d.notes.splice(d.notes.indexOf(n), 1); }]); break; }
    case 'done': { const t = S.tasks.find(x => x.id === id); t.done = true; toast(`Готово: «${t.title}»`, ['Вернуть', () => { t.done = false; }]); break; }
    case 'copy': {
      const box = $('draft-box'), st = $('copy-status');
      navigator.clipboard.writeText(box.value).then(() => { st.textContent = 'Скопировано'; }, () => { box.select(); st.textContent = 'Выделено, нажмите Cmd+C'; });
      return;
    }
    case 'ai-example': $('note').value = SAMPLE_NOTE; return;
    case 'note-save': {
      const text = $('note').value.trim(), file = $('note-file').files[0]?.name;
      if (!text && !file) { $('note').focus(); return; }
      const kind = $('note-kind').value === 'call' ? 'call' : undefined, pv = text ? previewNote(text) : null;
      if (pv && (pv.changes.length || pv.task || pv.stage)) { busy(el, 'ИИ читает заметку…', () => { ui.preview = { ...pv, kind, file }; renderDeal(); }); return; }
      const d = deal(ui.dealId);
      d.notes.push({ date: iso(0), author: S.me, kind, file, text });
      if (kind) d.lastContact = iso(0);
      $('note').value = '';
      break;
    }
    case 'ai-skip': {
      const d = deal(ui.dealId), p = ui.preview;
      d.notes.push({ date: iso(0), author: S.me, kind: p.kind, file: p.file, text: p.text });
      if (p.kind) d.lastContact = iso(0);
      ui.preview = null; $('note').value = '';
      break;
    }
    case 'ai-cancel': ui.preview = null; renderDeal(); return;
    case 'ai-apply': {
      const d = deal(ui.dealId), p = ui.preview;
      Object.assign(d, p.fields);
      if (p.stage) d.stageId = p.stage.id;
      if (p.task) S.tasks.push({ id: 't' + (++S.seq), dealId: d.id, title: p.task.title, due: p.task.due, done: false });
      d.notes.push({ date: iso(0), author: S.me, kind: p.kind, file: p.file, text: p.text });
      d.lastContact = iso(0);
      ui.preview = null; $('note').value = '';
      break;
    }
    case 'edit': ui.editing = true; renderDeal(); return;
    case 'edit-cancel': ui.editing = false; renderDeal(); return;
    case 'extend': { const b = S.bookings.find(x => x.id === id), was = b.expires; b.expires = iso(Math.max(days(b.expires), 0) + 7); toast(`Бронь продлена до ${fmtDate(b.expires)}`, ['Вернуть', () => { b.expires = was; }]); break; }
    case 'close-booking': {
      const b = S.bookings.find(x => x.id === id), o = ob(b.objectId);
      b.closed = true;
      if (o?.status === 'бронь') o.status = isOpen(deal(b.dealId)) ? 'свободна' : 'продана';
      break;
    }
    case 'place': if ($('modal').classList.contains('search')) $('modal').close(); openPlace(id, el.dataset.unit); return;
    case 'unit': ui.unitId = id; renderPlace(); $('unit-detail')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return;
    case 'book': openAdvance($('b-deal').value, bookStage().id, id); return;
    case 'rooms': ui.rooms = el.dataset.rooms === '' ? null : Number(el.dataset.rooms); renderPlace(); return;
    case 'objview': objView = el.dataset.view; break;
    case 'kanban-tip': me().settings.kanbanTip = true; break;
    case 'toggle-filters': ui.filtersOpen = !ui.filtersOpen; break;
    case 'f-room': { const r = Number(el.dataset.rooms); F.rooms = F.rooms.includes(r) ? F.rooms.filter(x => x !== r) : [...F.rooms, r]; el.setAttribute('aria-pressed', F.rooms.includes(r)); fillResults(); return; }
    case 'f-district': { const v = el.dataset.district; F.district = F.district.includes(v) ? F.district.filter(x => x !== v) : [...F.district, v]; el.setAttribute('aria-pressed', F.district.includes(v)); fillResults(); return; }
    case 'f-reset': F = { ...F0, rooms: [] }; mapView = null; break;
    case 'deal-search': F = fromDeal(deal(id)); objView = 'list'; tab = 'objects'; mapView = null; $('drawer').close(); try { history.replaceState(null, '', '#objects'); } catch (err) {} break;
    case 'listing-new': openListing(); return;
    case 'listing-edit': openListing(id); return;
    case 'l-ai-example': $('l-ai').value = SAMPLE_LISTING; return;
    case 'l-ai': {
      const text = $('l-ai').value.trim();
      if (!text) { $('l-ai').focus(); return; }
      if (!el.dataset.go) return busy(el, 'ИИ заполняет поля…', () => { el.dataset.go = '1'; el.click(); });
      delete el.dataset.go;
      syncListing();
      const r = parseListing(text), names = { rooms: 'комнаты', district: 'район', price: 'цена', area: 'площадь', kitchen: 'кухня', floor: 'этаж', floors: 'этажность', address: 'адрес', renovation: 'ремонт', bathroom: 'санузел', balcony: 'балкон' };
      Object.assign(ui.listing, r);
      if (!ui.listing.description) ui.listing.description = genDescription(ui.listing);
      ui.listingMsg = Object.keys(r).length ? `ИИ заполнил: ${Object.keys(r).map(k => names[k]).join(', ')}. Проверьте поля ниже.` : '!ИИ не нашёл в тексте данных о квартире. Добавьте площадь, этаж, цену или адрес.';
      renderListing(); initPickMap(); $('l-ai').value = text; return;
    }
    case 'l-desc': syncListing(); ui.listing.description = genDescription(ui.listing); renderListing(); initPickMap(); return;
    case 'l-photo-del': syncListing(); ui.listing.photos.splice(Number(el.dataset.i), 1); renderListing(); initPickMap(); return;
    case 'invoice': openInvoice(id); return;
    case 'issue': { const k = S.commissions.find(x => x.id === id); k.status = 'счёт выставлен'; $('modal').close(); toast(`Счёт на ${rub(k.amount)} отмечен выставленным`); break; }
    case 'paid': { const k = S.commissions.find(x => x.id === id); k.status = 'получена'; toast(`Комиссия ${rub(k.amount)} получена`, ['Вернуть', () => { k.status = 'счёт выставлен'; }]); break; }
    case 'import-open': openImport(); return;
    case 'chat-example': $('chat').value = SAMPLE_CHAT; return;
    case 'parse': if (!$('chat').value.trim()) { $('chat').focus(); return; } busy(el, 'ИИ разбирает переписку…', () => showParsed(parseChat($('chat').value))); return;
    case 'stages': ui.stageErr = ''; openStages(); return;
    case 'st-up': moveStage(id, -1); stagesChanged(); return;
    case 'st-down': moveStage(id, 1); stagesChanged(); return;
    case 'st-add': S.stages.splice(S.stages.length - 1, 0, { id: 's' + (++S.seq), name: 'Новый этап', gate: '' }); stagesChanged(); return;
    case 'st-del': {
      const n = S.deals.filter(d => d.stageId === id).length;
      if (S.stages.length <= 2) ui.stageErr = 'В воронке должно остаться хотя бы два этапа.';
      else if (n) ui.stageErr = `Нельзя удалить «${stage(id).name}»: в нём ${n} ${plural(n, ['сделка', 'сделки', 'сделок'])}. Сначала перенесите ${n === 1 ? "её" : "их"} в другой этап.`;
      else { S.stages = S.stages.filter(s => s.id !== id); stagesChanged(); return; }
      openStages(); return;
    }
    case 'reset': S = seed(); fixUsers(); if (user(session)) S.me = session; applyTheme(); ui = { dealId: null, placeId: null, unitId: null, rooms: null, draft: false, editing: false, preview: null, stageErr: '' }; filterAgent = ''; $('drawer').close(); $('modal').close(); break;
    default: return;
  }
  save(); render();
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && !$('app').hidden) { e.preventDefault(); openSearch(); }
  if (e.key === 'Enter' && e.target.id === 'gs-q') { e.preventDefault(); document.querySelector('.gs-item')?.click(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'gs-q') return fillSearch(e.target.value);
  if (e.target.closest?.('#filters') && e.target.id !== 'f-deal') { readFilters(); fillResults(); }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'note-file') { $('note-file-name').textContent = t.files[0]?.name || ''; if (t.files[0]) $('note-kind').value = 'call'; return; }
  if (t.id === 'f-deal') { if (t.value) { F = fromDeal(deal(t.value)); mapView = null; render(); } return; }
  if (t.id === 'l-photos') {
    const files = [...t.files].slice(0, 12 - ui.listing.photos.length);
    syncListing();
    ui.listingMsg = '';
    for (const f of files) { try { ui.listing.photos.push(await readPhoto(f)); } catch (err) { ui.listingMsg = `!Не удалось прочитать файл ${f.name}: это не изображение.`; } }
    renderListing(); initPickMap(); return;
  }
  if (t.dataset.doc) {
    const f = t.files[0], kind = REQUIRED_DOCS[Number(t.dataset.doc)];
    if (!f) return;
    syncListing();
    // shortcut: храним только имя и размер файла, содержимое не сохраняется; с бэкендом — загрузка в файловое хранилище
    ui.listing.docs = [...ui.listing.docs.filter(d => d.kind !== kind), { kind, file: f.name, size: f.size }];
    renderListing(); initPickMap(); return;
  }
  if (t.closest?.('#filters') || t.closest?.('#listing-form')) return;
  if (t.id === 'pf-theme') { me().settings.theme = t.value; applyTheme(); }
  else if (t.id === 'pf-hints') me().settings.aiHints = t.checked;
  else if (t.id === 'pf-photo') {
    const f = t.files[0];
    if (!f) return;
    try { me().photo = await readPhoto(f, 256); } catch (err) { toast('Не удалось прочитать фото: выберите изображение.'); return; }
  }
  else if (t.id === 'filter-agent') filterAgent = t.value;
  else if (t.id === 'deal-agent') deal(ui.dealId).agentId = t.value;
  else if (t.dataset.role) user(t.dataset.role).role = t.value;
  else if (t.dataset.stageGate !== undefined) { stage(t.dataset.stageGate).gate = t.value; save(); return; }
  else if (t.dataset.stageName) { const v = t.value.trim(); if (v) stage(t.dataset.stageName).name = v; save(); render(); return; }
  else return;
  save(); render();
});

document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'listing-form') return saveListing(e.submitter?.value || 'draft');
  if (f.id === 'adv-form') return applyAdvance();
  if (f.id === 'lose-form') {
    const d = deal(ui.loseId);
    d.lost = { reason: $('lose-reason').value, comment: $('lose-comment').value.trim(), date: iso(0) };
    S.bookings.filter(b => b.dealId === d.id && !b.closed).forEach(b => { b.closed = true; const o = ob(b.objectId); if (o?.status === 'бронь') o.status = 'свободна'; });
    S.tasks.filter(t => t.dealId === d.id && !t.done).forEach(t => { t.done = true; t.cancelled = true; });
    d.notes.push({ date: iso(0), author: S.me, kind: 'lost', text: `${d.lost.reason}${d.lost.comment ? ': ' + d.lost.comment : ''}` });
    save(); $('modal').close(); render(); return;
  }
  if (f.id === 'filters') return;
  if (f.id === 'edit-deal') { Object.assign(deal(ui.dealId), readForm()); ui.editing = false; }
  else if (f.id === 'add-task') S.tasks.push({ id: 't' + (++S.seq), dealId: ui.dealId, title: $('nt-title').value.trim(), due: $('nt-due').value, done: false });
  else if (f.id === 'add-user') {
    const email = $('nu-email').value.trim().toLowerCase();
    if (S.users.some(u => u.email.toLowerCase() === email)) { toast('Сотрудник с такой почтой уже есть.'); return; }
    S.users.push({ id: 'u' + (++S.seq), name: $('nu-name').value.trim(), role: $('nu-role').value, email, phone: '', settings: { theme: 'system', aiHints: true } });
  }
  else if (f.id === 'login-form') {
    const u = S.users.find(x => x.email.toLowerCase() === $('lg-email').value.trim().toLowerCase());
    if (!u || $('lg-pass').value !== 'demo') { const er = $('lg-err'); er.textContent = 'Неверная почта или пароль. В демо пароль для всех аккаунтов: demo.'; er.hidden = false; return; }
    return logIn(u.id);
  }
  else if (f.id === 'profile-form') {
    const u = me(), email = $('pf-email').value.trim();
    if (S.users.some(x => x !== u && x.email.toLowerCase() === email.toLowerCase())) { toast('Эта почта уже у другого сотрудника.'); return; }
    Object.assign(u, { name: $('pf-name').value.trim() || u.name, phone: $('pf-phone').value.trim(), email: $('pf-email').value.trim() || u.email });
    toast('Профиль сохранён.');
  }
  else if (f.id === 'parsed') {
    const text = $('chat').value.trim(), r = parseChat(text), digits = s => s.replace(/\D/g, '').slice(-10);
    const ph = digits($('e-phone').value), dup = ph && S.deals.find(x => digits(x.phone) === ph);
    if (dup) { const er = $('parsed-err'); er.innerHTML = scopedIds().has(dup.id) ? `Клиент с этим телефоном уже есть: ${dealLink(dup)}` : `Клиент с этим телефоном уже в работе у агента ${esc(user(dup.agentId)?.name)}.`; er.hidden = false; return; }
    const d = { id: 'd' + (++S.seq), agentId: $('n-agent')?.value || S.me, stageId: S.stages[0].id, lastContact: iso(0), notes: [{ date: iso(0), author: S.me, text }], ...DEFAULTS, ...readForm() };
    S.deals.push(d);
    S.tasks.push({ id: 't' + (++S.seq), dealId: d.id, title: r.next ? taskTitle(r.next.kind) : 'Первый звонок', due: iso(r.next ? r.next.inDays : 0), done: false, closeOn: r.next ? undefined : 'call' });
    save(); $('modal').close(); tab = 'deals'; render(); openDeal(d.id); return;
  }
  else return;
  save(); render();
});

// Перетаскивание сделок между этапами мышью; на телефоне этап меняется в карточке сделки
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.card[draggable]');
  if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  c.classList.add('dragging');
});
document.addEventListener('dragend', e => { e.target.classList?.remove('dragging'); document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); });
document.addEventListener('dragover', e => {
  const col = e.target.closest?.('.col[data-stage]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(c => c !== col && c.classList.remove('over'));
  col.classList.add('over');
});
document.addEventListener('drop', e => {
  const col = e.target.closest?.('.col[data-stage]');
  if (!col) return;
  e.preventDefault();
  const d = deal(e.dataTransfer.getData('text/plain')), target = col.dataset.stage;
  if (!d) return;
  if (target === 'lost') { if (!d.lost) openLose(d.id); return; }
  if (d.lost) { toast('Сначала верните сделку в работу: откройте её и нажмите «Вернуть в работу».'); return; }
  const i = S.stages.findIndex(s => s.id === d.stageId), j = S.stages.findIndex(s => s.id === target);
  if (j === i) return;
  if (j < i) { d.stageId = target; d.notes.push({ date: iso(0), author: S.me, kind: 'stage', text: `Возвращена на этап «${S.stages[j].name}»` }); save(); render(); return; }
  if (j === i + 1) { openAdvance(d.id); return; }
  toast(`Сделка двигается на один этап за раз. Сначала переведите её на «${S.stages[i + 1].name}».`);
});

$('modal').addEventListener('close', () => { $('modal').classList.remove('wide', 'search'); if (pickMap) { pickMap.remove(); pickMap = null; } });

// Адрес #/deal/<id> открывает сделку; закрытие страницы сделки возвращает адрес раздела
function route() {
  const id = location.hash.startsWith('#/deal/') && location.hash.slice(7);
  if (id && scoped().some(d => d.id === id)) openDeal(id);
  else if ($('drawer').open && $('drawer').classList.contains('page')) $('drawer').close();
}
window.addEventListener('popstate', () => { if (session) route(); });
$('drawer').addEventListener('close', () => { if (location.hash.startsWith('#/deal/')) try { history.replaceState(null, '', '#' + tab); } catch (err) {} });

if (session && user(session)) logIn(session, true); else showLogin();
