<meta charset="utf-8">
<title>Realtika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: рабочий стол агента — шапка с вкладками и входом, один рабочий вид под ней, сделка выезжает справа */
:root {
  --bg: #F2F3F1; --surface: #FFFFFF; --sunken: #E8EBE8; --ink: #1B2220; --muted: #5B6560; --line: #D9DEDA;
  --accent: #8F611A; --accent-ink: #FFFFFF;
  --ok: #2B7549; --warn: #965F00; --crit: #AE352C;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1A201E; --sunken: #161B19; --ink: #E6EAE8; --muted: #97A19C; --line: #2B3431;
    --accent: #D6A24A; --accent-ink: #1A1206; --ok: #5CBB83; --warn: #E2A43C; --crit: #F07A6F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1A201E; --sunken: #161B19; --ink: #E6EAE8; --muted: #97A19C; --line: #2B3431;
  --accent: #D6A24A; --accent-ink: #1A1206; --ok: #5CBB83; --warn: #E2A43C; --crit: #F07A6F; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); padding-inline: 16px; }
.wrap { max-width: 1440px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.brand { font: 600 20px/1 var(--f-display); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
.brand span { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.tab { font: 500 14px var(--f-body); color: var(--muted); background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.tab:hover { color: var(--ink); background: var(--sunken); }
.tab[aria-current="page"] { color: var(--ink); background: var(--sunken); font-weight: 600; }
.tab b { font-weight: 600; color: var(--crit); margin-left: 4px; font-variant-numeric: tabular-nums; }
.me { display: flex; align-items: center; gap: 8px; }
.me select { width: auto; max-width: 260px; }
header.top .btn { white-space: normal; text-align: left; }

.btn { font: 600 14px var(--f-body); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 500; text-decoration: underline; text-align: left; }
td .btn.link, .trow .btn.link, .alert .btn.link { color: var(--ink); text-decoration-color: var(--line); }

main { padding-block: 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.section { display: grid; gap: 12px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select { width: auto; }
.group-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }

.pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, currentColor 13%, transparent); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.crit { color: var(--crit); } .pill.muted { color: var(--muted); } .pill.accent { color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.stat b { font: 600 22px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.list > * { border-bottom: 1px solid var(--line); }
.list > *:last-child { border-bottom: 0; }
.alert { display: grid; grid-template-columns: 150px 1fr auto; gap: 8px 16px; align-items: center; padding: 12px 16px; }
.alert p { margin: 0; min-width: 0; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 16px; }
.trow input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.trow > label, .trow .title { color: var(--ink); font-size: 15px; font-weight: 500; }
.trow .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.empty { padding: 18px 16px; color: var(--muted); }

.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--sunken); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col h3 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; padding: 2px 4px; }
.card { display: grid; gap: 4px; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: grab; }
.card:hover { border-color: var(--accent); }
.card.dragging { opacity: .45; }
.card strong { font-weight: 600; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.who { font-size: 12px; color: var(--muted); }

.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; white-space: nowrap; }
td select { width: auto; }

dialog { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0; }
dialog::backdrop { background: rgb(10 14 12 / .45); }
dialog.drawer { margin: 0 0 0 auto; width: min(520px, 100%); height: 100%; max-height: 100%; border-width: 0 0 0 1px; }
dialog.modal { width: min(600px, calc(100% - 32px)); border-radius: var(--r); }
.dlg { padding: 20px; display: grid; gap: 22px; align-content: start; box-sizing: border-box; min-height: 100%; }
.dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.x { font: 24px/1 var(--f-body); background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dt { color: var(--muted); } dd { margin: 0; }
.block { display: grid; gap: 8px; }
.block > h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ai { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.ai ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.ai s { color: var(--muted); }
.match { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.match .row { display: flex; flex-wrap: wrap; gap: 6px; }
.note { display: grid; gap: 2px; padding-left: 12px; border-left: 2px solid var(--line); }
.note p { margin: 0; }
.err { color: var(--crit); font-size: 13px; margin: 0; }

label { font-size: 13px; font-weight: 600; color: var(--muted); }
input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
input[type="checkbox"] { width: auto; }
textarea { resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; align-content: start; }
.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stage-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; }

.invoice { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; background: var(--bg); }
.invoice .total { display: flex; justify-content: space-between; font-weight: 700; border-top: 1px solid var(--line); padding-top: 10px; font-variant-numeric: tabular-nums; }

#map { height: 460px; border-radius: var(--r); border: 1px solid var(--line); background: var(--sunken); z-index: 0; }
#map.map-empty { display: grid; place-items: center; color: var(--muted); padding: 16px; text-align: center; }
.pin span { display: inline-block; transform: translate(-50%, -100%); white-space: nowrap; font: 600 12px/1 var(--f-body); padding: 6px 8px; border-radius: 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 6px rgb(0 0 0 / .2); cursor: pointer; }
.pin.new span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pin.off span { opacity: .55; }
dialog.drawer.wide { width: min(660px, 100%); }
.chess { display: grid; gap: 4px; overflow-x: auto; }
.chess .fl { font-size: 12px; color: var(--muted); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.unit { font: 600 11px/1.25 var(--f-body); padding: 5px 2px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); }
.unit small { display: block; font-weight: 500; color: var(--muted); }
.unit.free { background: color-mix(in srgb, var(--ok) 18%, var(--surface)); }
.unit.booked { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
.unit.sold { background: var(--sunken); color: var(--muted); }
.unit.dim { opacity: .25; }
.unit[aria-pressed="true"] { border-color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.btn.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plan { width: 100%; max-width: 440px; height: auto; }
.plan .room { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.plan .wet { fill: var(--sunken); stroke: var(--ink); stroke-width: 2; }
.plan .outer { fill: none; stroke: var(--ink); stroke-width: 5; }
.plan text { fill: var(--ink); font: 500 12px var(--f-body); text-anchor: middle; }
.plan .sub { fill: var(--muted); font-size: 11px; }
.doc { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; }

footer { padding-block: 16px 32px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

@media (max-width: 640px) {
  .alert { grid-template-columns: 1fr; }
  .trow { grid-template-columns: auto minmax(0, 1fr); }
  .trow > :last-child { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .btn { transition: border-color .15s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Realtika <span>демо</span></div>
    <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
    <button class="btn primary" data-act="import-open">+ Сделка из переписки</button>
    <div class="me"><label for="me">Вы</label><select id="me"></select></div>
  </header>
  <main id="view"></main>
  <footer class="small muted">
    <span>Вымышленные данные. Вход демонстрационный: выберите сотрудника вверху справа. ИИ работает в режиме заглушки: правила вместо модели.</span>
    <button class="btn link small" data-act="reset">Сбросить демо-данные</button>
  </footer>
</div>

<dialog id="drawer" class="drawer" aria-label="Сделка"></dialog>
<dialog id="modal" class="modal"></dialog>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="parse.js"></script>
<script>
const K = 'realtika-demo-v3';
const ROLES = { agent: 'Агент', head: 'Руководитель отдела продаж', director: 'Директор' };
const TABS = [['tasks', 'Задачи'], ['deals', 'Сделки'], ['objects', 'Объекты'], ['bookings', 'Брони'], ['commissions', 'Комиссии'], ['team', 'Команда']];
const PAYMENTS = ['', 'ипотека', 'наличные', 'рассрочка'];
const DAY = 864e5;

const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const iso = off => { const d = new Date(today().getTime() + off * DAY + DAY / 2); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const days = s => { const [y, m, d] = s.split('-').map(Number); return Math.round((new Date(y, m - 1, d) - today()) / DAY); };
const fmtDate = s => s.split('-').reverse().join('.');
const rub = n => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
const mln = n => (n / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' млн ₽';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, f) => f[n % 10 === 1 && n % 100 !== 11 ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2];
const dayWord = n => `${n} ${plural(n, ['день', 'дня', 'дней'])}`;
const roomsLabel = r => r == null ? 'любая' : r === 0 ? 'студия' : `${r}-к`;
const yesNo = v => v ? 'да' : 'нет';
const dueLabel = s => { const d = days(s); return d === 0 ? 'сегодня' : d === 1 ? 'завтра' : d === -1 ? 'вчера' : fmtDate(s); };
const dueCls = s => { const d = days(s); return d < 0 ? 'crit' : d === 0 ? 'warn' : 'muted'; };

// Поля сделки, которые заполняет ИИ или агент вручную
const FIELDS = [
  ['budget', 'Бюджет', v => v ? 'до ' + mln(v) : '—'],
  ['rooms', 'Комнаты', roomsLabel],
  ['district', 'Район', v => v || 'любой'],
  ['type', 'Рынок', v => v === 'любая' ? 'любой' : v],
  ['payment', 'Оплата', v => v || '—'],
  ['downPayment', 'Первый взнос', v => v ? mln(v) : '—'],
  ['mortgageApproved', 'Ипотека одобрена', yesNo],
  ['alternative', 'Продаёт своё жильё', yesNo],
  ['source', 'Источник', v => v || '—'],
];
const DEFAULTS = { budget: 0, rooms: null, district: '', type: 'любая', payment: '', downPayment: 0, mortgageApproved: false, alternative: false, source: '' };

// Новостройки: дом с шахматкой квартир. Цены и статусы сгенерированы детерминированно для демо
const COMPLEXES = [
  { id: 'c1', name: 'ЖК «Северная гавань»', district: 'Приморский', developer: 'СЗ «Демо-Строй»', deadline: 'IV кв. 2027', lat: 60.003, lng: 30.212, floors: 12, layout: [0, 1, 1, 2, 2, 3], m2: 205000 },
  { id: 'c2', name: 'ЖК «Пулковские высоты»', district: 'Московский', developer: 'СЗ «Демо-Строй»', deadline: 'II кв. 2027', lat: 59.836, lng: 30.322, floors: 14, layout: [1, 1, 2, 2, 3, 3], m2: 198000 },
  { id: 'c3', name: 'ЖК «Невская волна»', district: 'Невский', developer: 'СЗ «Пример-Девелопмент»', deadline: 'дом сдан', lat: 59.884, lng: 30.468, floors: 10, layout: [0, 0, 1, 1, 2, 2], m2: 220000 },
  { id: 'c4', name: 'ЖК «Охта-парк»', district: 'Красногвардейский', developer: 'СЗ «Пример-Девелопмент»', deadline: 'III кв. 2028', lat: 59.957, lng: 30.443, floors: 9, layout: [0, 1, 1, 2, 2, 3], m2: 190000 },
];
const AREA = { 0: 25, 1: 37, 2: 58, 3: 80 };
function genUnits(c) {
  const out = [];
  for (let fl = 2; fl <= c.floors; fl++) c.layout.forEach((rooms, i) => {
    const number = (fl - 2) * c.layout.length + i + 1, area = AREA[rooms] + (i % 2) * 2;
    const h = (number * 37 + fl * 11 + c.id.charCodeAt(1)) % 10;
    out.push({ id: `${c.id}-${number}`, complexId: c.id, number, floor: fl, rooms, area, type: 'новостройка', district: c.district, address: c.name, lat: c.lat, lng: c.lng,
      price: Math.round(area * c.m2 * (1 + fl * 0.006) / 1e4) * 1e4, status: h < 3 ? 'продана' : h === 3 ? 'бронь' : 'свободна' });
  });
  return out;
}
const COMPLEX_DOCS = ['Разрешение на строительство', 'Проектная декларация', 'Договор ДДУ (шаблон)', 'Аккредитованные банки', 'Планировки и отделка'];
const SECONDARY_DOCS = [['Выписка из ЕГРН', true], ['Технический план', true], ['Справка о зарегистрированных', false], ['Согласие супруга на продажу', false]];
const UNIT_STATUS = { 'свободна': 'free', 'бронь': 'booked', 'продана': 'sold' };

function seed() {
  const D = (id, agentId, stageId, name, phone, last, f) => ({ id, agentId, stageId, name, phone, lastContact: iso(last), notes: [], ...DEFAULTS, ...f });
  const O = (id, rooms, district, address, area, price, floor, lat, lng, status = 'свободна') => ({ id, rooms, type: 'вторичка', district, address, area, price, floor, lat, lng, status });
  const units = COMPLEXES.flatMap(genUnits);
  // квартиры под брони из демо-сделок: свободная на 5-м этаже и выше
  const pick = (cid, rooms, status) => { const u = units.find(x => x.complexId === cid && x.rooms === rooms && x.status === 'свободна' && x.floor >= 5); u.status = status; return u; };
  const u5 = pick('c2', 2, 'бронь'), u12 = pick('c1', 2, 'бронь'), u11 = pick('c2', 3, 'продана');
  const deals = [
    D('d1', 'u3', 's5', 'Анна Смирнова', '+7 900 000-00-01', -6, { budget: 12.5e6, rooms: 2, district: 'Приморский', type: 'вторичка', payment: 'ипотека', downPayment: 2.5e6, mortgageApproved: true, source: 'Авито' }),
    D('d2', 'u3', 's1', 'Игорь Ковалёв', '+7 900 000-00-02', -1, { budget: 8e6, rooms: 1, district: 'Московский', type: 'новостройка', payment: 'ипотека', source: 'Циан' }),
    D('d3', 'u4', 's5', 'Мария Лебедева', '+7 900 000-00-03', -2, { budget: 18e6, rooms: 3, district: 'Петроградский', type: 'вторичка', payment: 'наличные', alternative: true, source: 'Рекомендация' }),
    D('d4', 'u3', 's2', 'Дмитрий Орлов', '+7 900 000-00-04', -9, { budget: 6.5e6, rooms: 0, district: 'Невский', type: 'новостройка', payment: 'ипотека' }),
    D('d5', 'u4', 's6', 'Елена Васильева', '+7 900 000-00-05', -1, { budget: 14e6, rooms: 2, district: 'Московский', type: 'новостройка', payment: 'ипотека', downPayment: 4e6, mortgageApproved: true }),

function scoped() {

  return filterAgent ? S.deals.filter(d => d.agentId === filterAgent) : S.deals;
}
const scopedIds = () => new Set(scoped().map(d => d.id));

function fits(d, o) {
  return o.status === 'свободна'
    && (d.type === 'любая' || o.type === d.type)
    && (d.rooms == null || o.rooms === d.rooms)
    && (!d.budget || o.price <= d.budget * 1.05);
}
function matches(d) {
  return S.objects.filter(o => fits(d, o)).map(o => {
    const why = [];
    const same = d.district && o.district === d.district;
    if (same) why.push(['ok', `район ${o.district}`]);
    else if (d.district) why.push(['muted', `другой район: ${o.district}`]);
    if (d.budget) why.push(o.price <= d.budget ? ['ok', 'в бюджете'] : ['warn', `на ${Math.round((o.price / d.budget - 1) * 100)}% выше бюджета`]);
    if (d.rooms != null) why.push(['ok', roomsLabel(o.rooms)]);
    return { o, why, score: (same ? 2 : 0) + (d.budget && o.price <= d.budget ? 1 : 0) };
  }).sort((a, b) => b.score - a.score || a.o.price - b.o.price).slice(0, 3);
}
function draftText(d) {
  const first = d.name.split(' ')[0];
  const m = matches(d).filter(x => x.score > 0);
  const req = `${roomsLabel(d.rooms)}, ${d.district || 'любой район'}${d.budget ? ', до ' + mln(d.budget) : ''}`;
  if (!m.length) return `${first}, добрый день! Продолжаем подбор под ваш запрос (${req}). Новых подходящих вариантов пока нет. Бюджет и район ещё актуальны?`;
  return `${first}, добрый день! Подобрали для вас ${m.length} ${plural(m.length, ['вариант', 'варианта', 'вариантов'])}:\n`
    + m.map(x => `— ${objTitle(x.o)}, ${mln(x.o.price)}`).join('\n') + `\nКогда вам удобно посмотреть?`;
}
function bookingState(b) {
  if (b.closed) return ['muted', 'закрыта'];
  const d = days(b.expires);
  if (d < 0) return ['crit', 'истекла'];
  if (d === 0) return ['warn', 'истекает сегодня'];
  return [d <= 3 ? 'warn' : 'ok', `осталось ${dayWord(d)}`];
}
const commState = s => ({ 'ожидается': 'warn', 'счёт выставлен': 'accent', 'получена': 'ok' }[s]);

// Подсказки ИИ: то, что агент забыл бы без CRM
function hints() {
  const ids = scopedIds(), out = [];
  S.bookings.filter(b => !b.closed && ids.has(b.dealId)).forEach(b => {
    const d = days(b.expires), dl = deal(b.dealId), what = `${b.kind.toLowerCase()} на ${objTitle(ob(b.objectId))}`;
    if (d < 0) out.push({ w: 0, p: pill('crit', 'Бронь истекла'), dl, text: `${esc(what)} истекла ${fmtDate(b.expires)}. Продлите или закройте.`, act: `<button class="btn sm" data-act="tab" data-tab="bookings">К броням</button>` });
    else if (d <= 3) out.push({ w: 1, p: pill('warn', d === 0 ? 'Бронь: сегодня' : `Бронь: ${dayWord(d)}`), dl, text: `${esc(what)} до ${fmtDate(b.expires)}.`, act: `<button class="btn sm" data-act="deal" data-id="${dl.id}">Открыть</button>` });
  });
  S.commissions.filter(k => ids.has(k.dealId) && k.status === 'ожидается' && days(k.dealDate) <= -3).forEach(k => {
    out.push({ w: 1, p: pill('warn', 'Нет счёта'), dl: deal(k.dealId), text: `комиссия ${rub(k.amount)} от ${k.payer === 'Застройщик' ? 'застройщика' : 'продавца'}: сделка ${dayWord(-days(k.dealDate))} назад, счёт не выставлен.`, act: `<button class="btn sm" data-act="invoice" data-id="${k.id}">Выставить счёт</button>` });
  });
  scoped().filter(d => isOpen(d) && days(d.lastContact) <= -5).forEach(d => {
    out.push({ w: 2, p: pill('warn', 'Давно не писали'), dl: d, text: `${dayWord(-days(d.lastContact))} без касания, этап «${esc(stage(d.stageId)?.name)}».`, act: `<button class="btn sm" data-act="draft" data-id="${d.id}">Черновик сообщения</button>` });
  });
  return out.sort((a, b) => a.w - b.w);
}

function previewNote(text) {
  const d = deal(ui.dealId), r = parseChat(text);
  const changes = [], fields = {};
  FIELDS.forEach(([k, label, f]) => {
    if (r[k] !== undefined && r[k] !== d[k]) { changes.push([label, f(d[k]), f(r[k])]); fields[k] = r[k]; }
  });
  const st = r.stage && S.stages.find(s => s.name === r.stage);
  const task = r.next ? { title: taskTitle(r.next.kind), due: iso(r.next.inDays) } : null;
  return { text, changes, fields, stage: st && st.id !== d.stageId ? st : null, task };
}

function initMap() {
  const el = $('map');
  if (!window.L) { el.classList.add('map-empty'); el.textContent = 'Карта не загрузилась. Проверьте интернет и обновите страницу; список объектов ниже работает.'; return; }
  map = L.map(el, { scrollWheelZoom: false, zoomSnap: 0.25 });
  if (mapView) map.setView(mapView.c, mapView.z);
  else map.fitBounds(S.objects.map(o => [o.lat, o.lng]), { padding: [60, 60] });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  const pin = (lat, lng, label, cls, id) => L.marker([lat, lng], { icon: L.divIcon({ className: 'pin ' + cls, html: `<span>${esc(label)}</span>`, iconSize: [0, 0] }), title: label })
    .on('click', () => openPlace(id)).addTo(map);
  S.complexes.forEach(c => {
    const free = S.objects.filter(o => o.complexId === c.id && o.status === 'свободна');
    pin(c.lat, c.lng, `${c.name.replace('ЖК ', '')} · ${free.length ? 'от ' + mlnShort(Math.min(...free.map(o => o.price))) : 'продано'}`, 'new', c.id);
  });
  S.objects.filter(o => !o.complexId).forEach(o => pin(o.lat, o.lng, `${roomsLabel(o.rooms)} · ${o.status === 'свободна' ? mlnShort(o.price) : o.status}`, o.status === 'свободна' ? '' : 'off', o.id));
  map.on('moveend', () => { mapView = { c: map.getCenter(), z: map.getZoom() }; });
}

// Схема квартиры по числу комнат и площади. shortcut: схема, не настоящий план; заменить на картинки планировок от застройщика
function planSvg(rooms, area) {
  const W = 360, H = 220, L0 = 96, wet = 9;
  const cells = rooms === 0 ? [['Студия', area - wet]] : [['Кухня', 11], ...Array.from({ length: rooms }, (_, i) => [rooms === 1 ? 'Комната' : `Комната ${i + 1}`, Math.round((area - 11 - wet) / rooms)])];
  const cw = (W - L0) / cells.length;
  const cell = (x, y, w, h, cls, name, m2) => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}"/><text x="${x + w / 2}" y="${y + h / 2 - 2}">${name}</text><text class="sub" x="${x + w / 2}" y="${y + h / 2 + 14}">${m2} м²</text>`;
  return `<svg class="plan" viewBox="-6 -6 ${W + 12} ${H + 12}" role="img" aria-label="Схема квартиры: ${roomsLabel(rooms)}, ${area} м²">
    ${cell(0, 0, L0, H * 0.45, 'wet', 'С/у', 4)}${cell(0, H * 0.45, L0, H * 0.55, 'room', 'Прихожая', 5)}
    ${cells.map(([name, m2], i) => cell(L0 + i * cw, 0, cw, H, 'room', name, m2)).join('')}
    <rect class="outer" x="0" y="0" width="${W}" height="${H}"/></svg>`;
}

      </div><p class="small muted" style="margin:0">Этаж слева, в ячейке номер квартиры, комнаты и цена в млн ₽. Нажмите на квартиру, чтобы увидеть планировку.</p></div>`;
  }

function openImport() {
  $('modal').innerHTML = `<div class="dlg">
    <div class="dlg-head"><div><h2>Сделка из переписки</h2><span class="muted small">Вставьте сообщение клиента или заметку после звонка. Пример уже вставлен.</span></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <div class="field"><label for="chat">Переписка</label><textarea id="chat" rows="5">${esc(SAMPLE_CHAT)}</textarea></div>
    <div class="actions"><button class="btn primary" data-act="parse">Разобрать</button>${pill('muted', 'ИИ-заглушка: правила вместо модели')}</div>
    <form id="parsed" class="block" hidden></form></div>`;
  $('modal').showModal();
}
function showParsed(r) {
  const c = can();
  $('parsed').innerHTML = `<h3 class="group-title">Проверьте и сохраните</h3>${dealFields({ ...DEFAULTS, name: '', phone: '', ...r })}
    ${c.all ? `<div class="field"><label for="n-agent">Ответственный</label><select id="n-agent">${S.users.map(u => `<option value="${u.id}"${u.id === S.me ? ' selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>` : ''}
    <div class="actions"><button class="btn primary" type="submit">Создать сделку</button></div>`;
  $('parsed').hidden = false;
}

function openStages() {
  const rows = S.stages.map((s, i) => `<div class="stage-row">
    <input id="st-${s.id}" data-stage-name="${s.id}" value="${esc(s.name)}" aria-label="Название этапа ${i + 1}">
    <button class="btn sm" data-act="st-up" data-id="${s.id}" aria-label="Выше"${i === 0 ? ' disabled' : ''}>↑</button>
    <button class="btn sm" data-act="st-down" data-id="${s.id}" aria-label="Ниже"${i === S.stages.length - 1 ? ' disabled' : ''}>↓</button>
    <button class="btn sm" data-act="st-del" data-id="${s.id}">Удалить</button></div>`).join('');
  $('modal').innerHTML = `<div class="dlg">
    <div class="dlg-head"><div><h2>Этапы воронки</h2><span class="muted small">Название меняется прямо в поле. Последний этап считается закрытой сделкой: по нему нет напоминаний.</span></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <div class="block">${rows}</div>
    ${ui.stageErr ? `<p class="err">${esc(ui.stageErr)}</p>` : ''}
    <div class="actions"><button class="btn sm" data-act="st-add">+ Добавить этап</button><button class="btn primary sm" data-act="close">Готово</button></div></div>`;
  if (!$('modal').open) $('modal').showModal();
}

function openInvoice(id) {
  const k = S.commissions.find(x => x.id === id), d = deal(k.dealId), o = ob(k.objectId);
  $('modal').innerHTML = `<div class="dlg">
    <div class="dlg-head"><div><h2>Счёт № R-${k.dealDate.slice(0, 4)}-${k.id.toUpperCase()}</h2><span class="muted small">от ${fmtDate(iso(0))}</span></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
    <div class="invoice"><dl>
      <dt>Исполнитель</dt><dd>АН «Демо-Недвижимость», ИНН 0000000000<br><span class="small muted">реквизиты берутся из настроек агентства</span></dd>
      <dt>Плательщик</dt><dd>${k.payer === 'Застройщик' ? `Застройщик, ${esc(o.address)}` : `Продавец объекта: ${esc(o.address)}`}</dd>
      <dt>Услуга</dt><dd>Агентское вознаграждение по сделке: ${esc(objTitle(o))}, покупатель ${esc(d.name)}, сделка ${fmtDate(k.dealDate)}</dd>
    </dl><div class="total"><span>Итого к оплате</span><span>${rub(k.amount)}</span></div></div>
    <p class="small muted" style="margin:0">Оплата поступает напрямую на счёт агентства. Realtika платежи не принимает.</p>
    <div class="actions">${k.status === 'ожидается' ? `<button class="btn primary" data-act="issue" data-id="${k.id}">Отметить: счёт выставлен</button>` : pill(commState(k.status), k.status)}</div></div>`;
  if (!$('modal').open) $('modal').showModal();
}

function moveStage(id, delta) {
  const i = S.stages.findIndex(s => s.id === id), j = i + delta;
  if (j < 0 || j >= S.stages.length) return;
  [S.stages[i], S.stages[j]] = [S.stages[j], S.stages[i]];
}
const stagesChanged = () => { ui.stageErr = ''; save(); render(); openStages(); };

document.addEventListener('click', e => {
  const dlg = e.target.closest('dialog');
  if (e.target === dlg) { dlg.close(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'tab': tab = el.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (err) {} $('modal').close(); $('drawer').close(); window.scrollTo(0, 0); break;
    case 'deal': openDeal(id); return;
    case 'draft': openDeal(id, true); return;
    case 'close': el.closest('dialog').close(); return;
    case 'contact': deal(id).lastContact = iso(0); break;
    case 'done': S.tasks.find(t => t.id === id).done = true; break;
    case 'copy': {
      const box = $('draft-box'), st = $('copy-status');
      navigator.clipboard.writeText(box.value).then(() => { st.textContent = 'Скопировано'; }, () => { box.select(); st.textContent = 'Выделено, нажмите Cmd+C'; });
      return;
    }
    case 'ai-example': $('note').value = SAMPLE_NOTE; return;
    case 'ai-note': {
      const text = $('note').value.trim();
      if (!text) { $('note').focus(); return; }
      ui.preview = previewNote(text); renderDeal(); return;
    }
    case 'ai-cancel': ui.preview = null; renderDeal(); return;
    case 'ai-apply': {
      const d = deal(ui.dealId), p = ui.preview;
      Object.assign(d, p.fields);
      if (p.stage) d.stageId = p.stage.id;
      if (p.task) S.tasks.push({ id: 't' + (++S.seq), dealId: d.id, title: p.task.title, due: p.task.due, done: false });
      d.notes.push({ date: iso(0), author: S.me, text: p.text });
      d.lastContact = iso(0);
      ui.preview = null; $('note').value = '';
      break;
    }
    case 'edit': ui.editing = true; renderDeal(); return;
    case 'edit-cancel': ui.editing = false; renderDeal(); return;
    case 'extend': { const b = S.bookings.find(x => x.id === id); b.expires = iso(Math.max(days(b.expires), 0) + 7); break; }
    case 'close-booking': {
      const b = S.bookings.find(x => x.id === id), o = ob(b.objectId);
      b.closed = true;
      if (o?.status === 'бронь') o.status = isOpen(deal(b.dealId)) ? 'свободна' : 'продана';
      break;
    }
    case 'place': openPlace(id, el.dataset.unit); return;
    case 'unit': ui.unitId = id; renderPlace(); return;
    case 'rooms': ui.rooms = el.dataset.rooms === '' ? null : Number(el.dataset.rooms); renderPlace(); return;
    case 'invoice': openInvoice(id); return;
    case 'issue': S.commissions.find(x => x.id === id).status = 'счёт выставлен'; $('modal').close(); break;
    case 'paid': S.commissions.find(x => x.id === id).status = 'получена'; break;
    case 'import-open': openImport(); return;
    case 'parse': showParsed(parseChat($('chat').value)); return;
    case 'stages': ui.stageErr = ''; openStages(); return;
    case 'st-up': moveStage(id, -1); stagesChanged(); return;
    case 'st-down': moveStage(id, 1); stagesChanged(); return;
    case 'st-add': S.stages.splice(S.stages.length - 1, 0, { id: 's' + (++S.seq), name: 'Новый этап' }); stagesChanged(); return;
    case 'st-del': {
      const n = S.deals.filter(d => d.stageId === id).length;
      if (S.stages.length <= 2) ui.stageErr = 'В воронке должно остаться хотя бы два этапа.';
      else if (n) ui.stageErr = `Нельзя удалить «${stage(id).name}»: в нём ${n} ${plural(n, ['сделка', 'сделки', 'сделок'])}. Сначала перенесите ${n === 1 ? "её" : "их"} в другой этап.`;
      else { S.stages = S.stages.filter(s => s.id !== id); stagesChanged(); return; }
      openStages(); return;
    }
    case 'reset': S = seed(); ui = { dealId: null, placeId: null, unitId: null, rooms: null, draft: false, editing: false, preview: null, stageErr: '' }; filterAgent = ''; $('drawer').close(); $('modal').close(); break;
    default: return;
  }
  save(); render();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'me') { S.me = t.value; filterAgent = ''; $('drawer').close(); $('modal').close(); ui.dealId = null; }
  else if (t.id === 'filter-agent') filterAgent = t.value;
  else if (t.id === 'deal-stage') deal(ui.dealId).stageId = t.value;
  else if (t.id === 'deal-agent') deal(ui.dealId).agentId = t.value;
  else if (t.dataset.role) user(t.dataset.role).role = t.value;
  else if (t.dataset.stageName) { const v = t.value.trim(); if (v) stage(t.dataset.stageName).name = v; save(); render(); return; }
  else return;
  save(); render();
});

document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'edit-deal') { Object.assign(deal(ui.dealId), readForm()); ui.editing = false; }
  else if (f.id === 'add-task') S.tasks.push({ id: 't' + (++S.seq), dealId: ui.dealId, title: $('nt-title').value.trim(), due: $('nt-due').value, done: false });
  else if (f.id === 'book-form') {
    const u = ob(ui.unitId), d = deal($('b-deal').value), st = S.stages.find(x => x.name === 'Бронь');
    S.bookings.push({ id: 'b' + (++S.seq), dealId: d.id, objectId: u.id, kind: u.complexId ? 'Бронь у застройщика' : 'Аванс', amount: Math.max(0, Number($('b-amount').value) || 0), holder: u.complexId ? 'Застройщик' : 'Агентство', expires: iso(7), closed: false });
    u.status = 'бронь';
    if (st) d.stageId = st.id;
  }
  else if (f.id === 'add-user') S.users.push({ id: 'u' + (++S.seq), name: $('nu-name').value.trim(), role: $('nu-role').value });
  else if (f.id === 'parsed') {
    const text = $('chat').value.trim(), r = parseChat(text);
    const d = { id: 'd' + (++S.seq), agentId: $('n-agent')?.value || S.me, stageId: S.stages[0].id, lastContact: iso(0), notes: [{ date: iso(0), author: S.me, text }], ...DEFAULTS, ...readForm() };
    S.deals.push(d);
    S.tasks.push({ id: 't' + (++S.seq), dealId: d.id, title: r.next ? taskTitle(r.next.kind) : 'Первый звонок', due: iso(r.next ? r.next.inDays : 0), done: false });
    save(); $('modal').close(); tab = 'deals'; render(); openDeal(d.id); return;
  }
  else return;
  save(); render();
});

// Перетаскивание сделок между этапами мышью; на телефоне этап меняется в карточке сделки
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.card[draggable]');
  if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  c.classList.add('dragging');
});
document.addEventListener('dragend', e => { e.target.classList?.remove('dragging'); document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); });
document.addEventListener('dragover', e => {
  const col = e.target.closest?.('.col[data-stage]');
  if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(c => c !== col && c.classList.remove('over'));
  col.classList.add('over');
});
document.addEventListener('drop', e => {
  const col = e.target.closest?.('.col[data-stage]');
  if (!col) return;
  e.preventDefault();
  const d = deal(e.dataTransfer.getData('text/plain'));
  if (d) { d.stageId = col.dataset.stage; save(); render(); }
});

render();
</script>
